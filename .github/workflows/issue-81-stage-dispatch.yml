name: Dispatch verified Issue 81 stage
on:
  push:
    branches: ['operations/issue-81-stage-dispatch-96977a48']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Recheck approved main and prevent duplicate staging runs
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "8baf361ae59603dc920fba34368a5abdbf44058c"
          count=$(gh api "repos/$GH_REPO/actions/workflows/stage.yml/runs?head_sha=8baf361ae59603dc920fba34368a5abdbf44058c&event=workflow_dispatch&per_page=20" --jq .total_count)
          test "$count" = 0
      - name: Dispatch the existing guarded default-branch workflow
        run: |
          gh workflow run stage.yml --repo "$GH_REPO" --ref main \
            -f approved_sha=8baf361ae59603dc920fba34368a5abdbf44058c \
            -f artifact_sha256=2494b5a3c05af43ee6eb06c638abcc5e0d0931f35125fda95a33d8864a6a3506 \
            -f distribution_tag=latest
