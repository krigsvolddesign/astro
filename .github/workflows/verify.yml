name: Verify Krigsvold Astro
on: [push, pull_request, workflow_call]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        astro: ['5.18.2', '7.3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krigsvoldtheme/npm
          ref: e1d77048df1c5b3ecfe5b214e3fda4f9fa4de259
          path: .core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run build && npm test
        working-directory: .core
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
        env:
          KRIGSVOLD_CORE_SOURCE: .core
          KRIGSVOLD_ASTRO_VERSION: ${{ matrix.astro }}
          KRIGSVOLD_BROWSER: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-qa-${{ matrix.astro }}
          path: artifacts/qa/
          if-no-files-found: ignore
